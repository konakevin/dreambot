# fly.toml app configuration file generated for dreambot-face-swap-dual on 2026-06-01T23:48:15-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dreambot-face-swap-dual'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep ONE machine always warm. At low traffic (late night) the dual face-swap
  # machine used to scale to zero (min=0), and the next request paid a ~9s Fly
  # cold-start that blew the swap deadline budget → "Face swap timed out" on
  # every dual-cast render until daytime traffic warmed it again (2026-06-15).
  # auto_start still spins up EXTRA machines under load; this just floors it at 1.
  #
  # BOTH MACHINES ALWAYS WARM (2026-09-23, NIGHTLY_ROBUSTNESS_PLAN.md item 6). Nightly runs every hour (each time
  # zone at its local 4am), and the second machine stopped a few minutes after going idle, so a Create couple
  # during a nightly swap (the swap capacity gate's reserved interactive slot) or the second swap of a burst paid
  # the cold start inside its deadline. auto_stop 'off' keeps every machine running; applied live to both
  # machines with `fly machine update <id> --autostop=off` (no deploy), recorded here so a deploy keeps it.
  # Rollback: `fly machine update 0807dd5f9e1198 --autostop=stop -a dreambot-face-swap-dual` (and set this
  # line back to 'stop').
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # PER-MACHINE CONCURRENCY (2026-09-12). Without this block Fly's default lets ~20 requests pile onto one
  # machine. Two concurrent dual swaps on one 2 GB performance-1x hung it (both pipelines completed, neither
  # finished, health check failed 26 s later) and the two edge requests died at the gateway's 150 s idle
  # cutoff. soft_limit 1 → the proxy prefers a free machine / auto-starts the standby for a second concurrent
  # swap; hard_limit 2 → a third queues rather than stacking. Capacity beyond that = `fly scale count N`
  # (QUEUE_WORKERS_REFACTOR.md runbook: scale Fly first, then raise the heavy cap).
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 1
    hard_limit = 2

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/healthz'

[[vm]]
  memory = '2gb'
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 2048
