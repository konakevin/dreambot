name: Upscale Smoke Test

# Guards the paid 4K HQ-download feature. The 2026-05-25 incident (upscaler
# 404'd on every call, silently) went unnoticed because failures only logged.
# This runs the live per-model upscale check on a schedule and FAILS LOUDLY
# (red workflow + notification) the moment the upscaler breaks.

on:
  schedule:
    - cron: '0 13 * * *' # daily ~6am MST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run upscale smoke test
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: node scripts/upscale-smoke-test.js
