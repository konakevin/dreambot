name: Dream Off Monitor

# Loud health check for Dream Off games (born dark — no-ops until the feature
# flag flips). Fails the run if games are overdue-but-not-advanced (the
# advance_expired_dream_offs pg_cron sweep isn't draining), a terminal game's pot
# never settled, or — highest severity — a pot's balance != its ledger sum (the
# escrow-correctness invariant is broken). See scripts/check-dream-off-health.js.

on:
  schedule:
    - cron: '25 * * * *' # hourly, offset 25m past the hour (spread out from the others)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check Dream Off health
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-dream-off-health.js
