name: Dream Queue Monitor

# Loud health check for the async dream_queue (nightly + first_dream drain via
# the dream-queue-worker pg_cron). Fails the run if jobs are stuck 'queued' /
# 'in_progress' (worker not draining) or dead_letters are piling up. This is the
# replacement for the old "0 nightly dreams = red CI" signal now that the cron
# only enqueues. See scripts/check-dream-queue.js.

on:
  schedule:
    - cron: '15 * * * *' # hourly, offset 15m past the hour
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check dream_queue health
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-dream-queue.js
