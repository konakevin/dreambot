name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno type check (Edge Functions)
        run: deno check supabase/functions/*/index.ts

      - name: Lint
        run: npx expo lint

      - name: Prettier
        run: npx prettier --check "**/*.{ts,tsx}" --ignore-path .gitignore

      - name: Tests
        run: npx jest --ci

  # Live-DB tests that need a real Postgres (ON CONFLICT / row-lock semantics
  # can't be faked in jest). Runs the *.dbspec.ts suites against an ephemeral
  # Postgres service container. The fixture loads the real DDL from the
  # migration files, so no Supabase-only roles/extensions are required.
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # trust auth — this is an ephemeral, job-scoped container on localhost
          # with no real data. No password (avoids a hardcoded-credential flag).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps

      - name: Live-DB tests (claim_upscale_job concurrency, etc.)
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: npm run test:dbspec -- --ci
