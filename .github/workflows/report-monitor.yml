name: Report Monitor

# Backstop for UNACTIONED content reports (App Store Guideline 1.2 — act within
# 24h). The primary alert is a real-time push to admins (migration 315); this
# fails the run (→ GitHub failure email) when any report has been open longer
# than REPORT_SLA_MINUTES (default 120). See scripts/check-reports.js.
# Requires migration 314 (reports.status).

on:
  schedule:
    - cron: '50 * * * *' # hourly, offset 50m past the hour (spread from other monitors)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check for unactioned reports
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # REPORT_SLA_MINUTES: '120'
        run: node scripts/check-reports.js
