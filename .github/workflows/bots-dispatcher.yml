name: Bots Dispatcher (DB-driven)

# Reads bot_schedules every 15 minutes, runs every bot whose next_due_at has
# passed. Replaces the 16 per-bot workflows with one schedule-driven dispatcher.
# Server-side cadence config:
#   UPDATE bot_schedules SET posts_per_day = N WHERE bot_name = '<name>';
# See BOTS.md "Scheduling" section for details.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 min, UTC — offset OFF :00 to de-conflict the top-of-hour DB burst (DB_CONNECTION_SATURATION_PLAN.md)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List due bots without running them'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: bots-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Sequential worst case: 17 bots × ~3min = 51min. Steady state: 0-2 bots
    # per tick = 3-6min. Initial cutover surge avoided via 15-min lead clamp
    # in rebalance_bot_schedules(900).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dispatch due bots
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Bots roll multi-provider models (ALL_ENABLED_AI_MODELS includes
          # google/gemini-2-image + openai/gpt-image-2). Without these keys the
          # dispatcher fails ~40% of runs (every non-Flux roll) and 5-in-a-row
          # auto-deactivates the bot — exactly what killed gothbot/brickbot/
          # yumbot (2026-06-07). Keys live in Edge secrets too (user renders).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/dispatch-bots.js --dry-run
          else
            node scripts/dispatch-bots.js
          fi
