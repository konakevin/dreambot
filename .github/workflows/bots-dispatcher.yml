name: Bots Dispatcher (DB-driven)

# Reads bot_schedules hourly, runs every bot whose next_due_at has passed.
# Replaces the 16 per-bot workflows with one schedule-driven dispatcher.
# Server-side cadence config:
#   UPDATE bot_schedules SET posts_per_day = N WHERE bot_name = '<name>';
# See BOTS.md "Scheduling" section for details.
#
# Cadence changed 15min -> hourly 2026-09-09 (Kevin: "seems like every 15 min
# is overkill?") — with posts_per_day=2 per bot and each bot's phase_seed
# already jittering its due time across the whole day, hourly checks add at
# most ~1h of drift to a post that's meant to land at a semi-random time
# anyway; genuinely imperceptible. Also found (same investigation) that
# GitHub was actually firing this schedule far below its configured rate
# regardless (~7% of expected fires over a 2-week sample — a GitHub-side
# scheduled-workflow reliability limit, not something fixable via config) —
# a coarser, less contended schedule is a small mitigation for that too.
on:
  schedule:
    - cron: '12 * * * *'   # hourly, offset 12m past the hour (de-conflicts the top-of-hour DB burst, DB_CONNECTION_SATURATION_PLAN.md)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List due bots without running them'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: bots-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Sequential worst case: 17 bots × ~3min = 51min. Steady state: 0-2 bots
    # per tick = 3-6min. Initial cutover surge avoided via 15-min lead clamp
    # in rebalance_bot_schedules(900).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dispatch due bots
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Bots roll multi-provider models (ALL_ENABLED_AI_MODELS includes
          # google/gemini-2-image + openai/gpt-image-2). Without these keys the
          # dispatcher fails ~40% of runs (every non-Flux roll) and 5-in-a-row
          # auto-deactivates the bot — exactly what killed gothbot/brickbot/
          # yumbot (2026-06-07). Keys live in Edge secrets too (user renders).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/dispatch-bots.js --dry-run
          else
            node scripts/dispatch-bots.js
          fi
