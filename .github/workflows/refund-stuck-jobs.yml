name: Refund Stuck Dream Jobs

# Sweeps for `dream_jobs` rows stuck in `processing` for >5 minutes and
# refunds the user's sparkle. Catches the case where the Edge Function
# died mid-execution (HTTP 546 worker-limit, 504 timeout, OOM) and no
# inline catch could run. Refunds are idempotent on jobId — safe if the
# inline catch already ran.

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Invoke refund-stuck-jobs Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # The function self-authenticates by string-matching the Bearer token
          # against its own SUPABASE_SERVICE_ROLE_KEY (auto-injected) OR the
          # DREAM_QUEUE_WORKER_TOKEN. Use the worker token: Supabase's new
          # sb_secret_* key format means the auto-injected service-role key no
          # longer matches the old JWT key in CI secrets (was 401'ing). The
          # worker token is a stable custom secret, identical on both sides.
          DREAM_QUEUE_WORKER_TOKEN: ${{ secrets.DREAM_QUEUE_WORKER_TOKEN }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://jimftynwrinwenonjrlj.supabase.co"
          fi
          RESP=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "${SUPABASE_URL}/functions/v1/refund-stuck-jobs" \
            -H "Authorization: Bearer ${DREAM_QUEUE_WORKER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"older_than_min": 5}')
          STATUS=$(echo "$RESP" | tail -1 | cut -d: -f2)
          BODY=$(echo "$RESP" | sed '$d')
          echo "Status: $STATUS"
          echo "Body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Sweeper returned non-200 status"
            exit 1
          fi
