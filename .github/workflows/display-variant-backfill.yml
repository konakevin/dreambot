name: Display Variant Backfill

# Builds uploads.image_url_display for any post still missing it. The nightly
# render now DEFERS the heavy full-res JPEG encode out of the edge isolate (it
# was the last in-isolate 546 resource-limit hot-spot) and leaves
# image_url_display NULL; this cron builds the small feed JPEG out-of-process
# (sharp) within minutes. Until it lands, the card falls back to the full-res
# original, and the full-screen view always uses the full-res original — so the
# dream's quality is never affected. Idempotent + resumable (only touches NULL
# rows). See scripts/backfill-display-variants.js.
#
# Second pass: builds uploads.image_url_thumb (a ~400x500 grid tile thumbnail,
# ~3x smaller than the 768px display variant) so the 3-col grid stops downloading
# oversized images. Same idempotent/resumable contract; the grid falls back to
# the display variant until a thumb lands. See scripts/backfill-grid-thumbs.js.

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *' # every 10 minutes — offset off :00 to de-conflict the top-of-hour DB burst
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build missing display variants
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backfill-display-variants.js --limit 1000
      - name: Build missing grid thumbnails
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # 4000/run (under the 20-min job timeout) so the initial ~30k backfill
        # clears in a handful of the (Actions-throttled, ~hourly) cron ticks
        # instead of dragging for hours at 1000/run. Steady-state it just finds
        # the few new-upload nulls and exits fast.
        run: node scripts/backfill-grid-thumbs.js --limit 4000
