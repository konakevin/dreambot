name: Nightly Coverage Sweep

# The guarantee backstop (NIGHTLY_DREAM_GUARANTEE_PLAN.md L5). Runs HOURLY, offset
# 30 min past the nightly enqueue, so each timezone gets swept once its local morning
# passes: any eligible user without a completed nightly for their local day is
# re-enqueued. Fails LOUD (email) only on a systemic gap spike, not routine one-offs.
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run nightly coverage sweep
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/nightly-coverage-sweep.js
