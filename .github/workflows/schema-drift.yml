name: schema-drift

# Anti-drift guard. Migrations are hand-applied in the Supabase dashboard, so the
# repo and the live schema can silently diverge (a partially-applied migration, or
# a dashboard change never back-ported). This regenerates types from live and fails
# if they differ from the committed types/database.ts — catching the next 047-style
# skip in CI instead of months later in production.
#
# Setup (one-time): add a repo secret SUPABASE_ACCESS_TOKEN — a Supabase personal
# access token (Account → Access Tokens). Read-only `gen types` usage.
#
# Runs on changes to migrations/types (where drift originates) and on a daily
# schedule (catches drift introduced by an out-of-band dashboard change).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'types/database.ts'
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check schema drift (repo types vs live DB)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: ./scripts/check-schema-drift.sh
